<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Diario personal minimalista en blanco y negro para registrar pensamientos e imágenes con sincronización en la nube." />
    <meta property="og:title" content="Tinta - Journal Minimalista" />
    <meta property="og:description" content="Diario personal minimalista en blanco y negro para registrar pensamientos e imágenes con sincronización en la nube." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore HMR WebSocket errors as HMR is disabled in this environment
      window.addEventListener('error', function(event) {
        if (event && event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('createWebSocketModuleRunnerTransport') ||
          event.message.includes('@vite/client')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason).includes('WebSocket') ||
          String(event.reason).includes('createWebSocketModuleRunnerTransport')
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
